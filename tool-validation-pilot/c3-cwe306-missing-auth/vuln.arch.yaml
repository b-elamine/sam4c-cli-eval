name: c3-auth-vuln
# CWE-306 missing authentication: an admin API is exposed to the internet, and the policy
# declares NO Authentication rule guarding it.
components:
  - name: AdminAPI
    type: App
    attributes: { Domain: admin }
    exposure: external
    ports:
      - { name: api, number: 8443, protocol: http }
connectors:
  - name: internet
links:
  - { port: AdminAPI.api, connector: internet, direction: in }
