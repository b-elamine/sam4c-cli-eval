name: c1-dos-vuln
# CWE-400 resource exhaustion / DoS-EDoS: a single, unspread replica is a single
# point of failure -- a successful DoS or a zone outage takes the service down.
components:
  - name: API
    type: App
    attributes: { Domain: backend }
    exposure: internal
    scale: { replicas: 1, min: 1, max: 1 }
    ports:
      - { name: http, number: 8080, protocol: http }
connectors:
  - name: ingress
links:
  - { port: API.http, connector: ingress, direction: in }
