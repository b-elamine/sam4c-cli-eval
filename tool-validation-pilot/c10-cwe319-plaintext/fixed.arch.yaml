name: c10-fixed
components:
  - name: Checkout
    type: App
    attributes: { Domain: checkout }
    exposure: internal
    ports:
      - { name: out, protocol: https }
  - name: Payment
    type: App
    attributes: { Domain: payment }
    exposure: internal
    ports:
      - { name: in, number: 8443, protocol: https }

connectors:
  - name: Checkout_to_Payment
    protocol: https
links:
  - { port: Checkout.out, connector: Checkout_to_Payment, direction: out }
  - { port: Payment.in, connector: Checkout_to_Payment, direction: in }
