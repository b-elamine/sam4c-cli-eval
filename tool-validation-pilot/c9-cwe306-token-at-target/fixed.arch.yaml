name: c9-cwe306-token-at-target-fixed
components:
  - name: Frontend
    type: App
    attributes: { Domain: frontend }
    exposure: internal
    ports:
      - { name: a_out, protocol: http }
      - { name: b_out, protocol: http }
  - name: Auth
    type: App
    attributes: { Domain: auth }
    exposure: internal
    credentials: [jwt-key]
    ports:
      - { name: in, number: 8080, protocol: http }
  - name: API
    type: App
    attributes: { Domain: api }
    exposure: internal
    credentials: [jwt-key]
    ports:
      - { name: in, number: 8081, protocol: http }

connectors:
  - name: FE_to_Auth
    protocol: http
  - name: FE_to_API
    protocol: http
links:
  - { port: Frontend.a_out, connector: FE_to_Auth, direction: out }
  - { port: Auth.in, connector: FE_to_Auth, direction: in }
  - { port: Frontend.b_out, connector: FE_to_API, direction: out }
  - { port: API.in, connector: FE_to_API, direction: in }
