name: c8-mediator-vuln
# Same as fixed.arch.yaml, but a debug/backup connector wires Frontend directly to DB,
# bypassing Backend. Isolation(..., via=Backend) must fire: a path to DB exists that never
# touches the declared mediator.
components:
  - name: Frontend
    type: App
    attributes: { Domain: frontend }
    exposure: internal
    ports:
      - { name: be_out, number: 443, protocol: http }
      - { name: db_debug_out, number: 5432, protocol: tcp }
  - name: Backend
    type: App
    attributes: { Domain: backend }
    exposure: internal
    ports:
      - { name: fe_in, number: 443, protocol: http }
      - { name: db_out, number: 5432, protocol: tcp }
  - name: DB
    type: Data
    attributes: { Domain: database, DataClass: pii }
    persistent: true
    storage: 20Gi
    ports:
      - { name: be_in, number: 5432, protocol: tcp }
      - { name: debug_in, number: 5433, protocol: tcp }
connectors:
  - name: FE_to_BE
  - name: BE_to_DB
  - name: FE_to_DB_debug
links:
  - { port: Frontend.be_out, connector: FE_to_BE, direction: out }
  - { port: Backend.fe_in, connector: FE_to_BE, direction: in }
  - { port: Backend.db_out, connector: BE_to_DB, direction: out }
  - { port: DB.be_in, connector: BE_to_DB, direction: in }
  - { port: Frontend.db_debug_out, connector: FE_to_DB_debug, direction: out }
  - { port: DB.debug_in, connector: FE_to_DB_debug, direction: in }
