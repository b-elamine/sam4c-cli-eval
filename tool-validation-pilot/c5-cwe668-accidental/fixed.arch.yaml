name: c5-accidental-fixed
# Fix: the connector is internal, matching the workload's declared exposure.
components:
  - name: Svc
    type: App
    attributes: { Domain: backend }
    exposure: internal
    ports:
      - { name: p, number: 9000, protocol: tcp }
connectors:
  - name: edge
    external: false
links:
  - { port: Svc.p, connector: edge, direction: in }
