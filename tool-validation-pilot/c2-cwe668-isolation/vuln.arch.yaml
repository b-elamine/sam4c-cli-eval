name: c2-iso-vuln
# CWE-668 exposure to wrong sphere: a frontend and a sensitive DB are wired to the SAME
# connector, so a network path exists between two components a rule requires isolated.
components:
  - name: Frontend
    type: App
    attributes: { Domain: frontend }
    exposure: internal
    ports:
      - { name: web, number: 443, protocol: http }
  - name: DB
    type: Data
    attributes: { Domain: database, DataClass: pii }
    persistent: true
    storage: 20Gi
    ports:
      - { name: sql, number: 5432, protocol: tcp }
connectors:
  - name: shared
links:
  - { port: Frontend.web, connector: shared, direction: out }
  - { port: DB.sql, connector: shared, direction: in }
