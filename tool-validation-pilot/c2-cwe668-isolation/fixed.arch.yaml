name: c2-iso-fixed
# Fix: the DB sits on its own connector; no shared path with the frontend -> Isolation holds.
components:
  - name: Frontend
    type: App
    attributes: { Domain: frontend }
    exposure: internal
    ports:
      - { name: web, number: 443, protocol: http }
  - name: DB
    type: Data
    attributes: { Domain: database, DataClass: pii }
    persistent: true
    storage: 20Gi
    ports:
      - { name: sql, number: 5432, protocol: tcp }
connectors:
  - name: public
  - name: dbnet
links:
  - { port: Frontend.web, connector: public, direction: out }
  - { port: DB.sql, connector: dbnet, direction: in }
