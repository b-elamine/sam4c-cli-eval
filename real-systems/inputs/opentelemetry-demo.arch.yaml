# Modeled from open-telemetry/opentelemetry-demo, compose.yaml (main branch,
# fetched 2026-07-31). Ships as Docker Compose, not Kubernetes manifests --
# Kubernetes deployment goes through a separate Helm chart repo. Using compose.yaml
# as ground truth instead: still real, public, authoritative deployment data, just
# a different format than the other 6 systems in this study.
#
# Modeled with Domain observability (previously excluded): load-generator, flagd,
# flagd-ui, telemetry-docs, otel-collector. Edges from compose depends_on and the
# OTEL_EXPORTER_OTLP_ENDPOINT / FLAGD_HOST env vars.
#
# Exposure judgment call, flagged explicitly: docker-compose maps a host port to
# every service for local dev convenience, which is not the same as production
# exposure. The real intended public entry point is frontend-proxy, an Envoy
# reverse proxy explicitly fronting frontend -- modeled as the only external
# component, not every service with a compose port mapping.
#
# Full-manifest pass (2026-09-20): every runnable unit of the ground-truth file is now
# modeled, none excluded. Tooling with host ports (dev UIs) is modeled internal, same
# exposure judgment as before. Edge sources: compose depends_on and env vars, see above.
#
# persistent = the data volume outlives the pod/container (PVC, volumeClaimTemplate,
# hostPath, or a named compose volume). emptyDir, no volume, or an init-script-only bind
# mount count as not persistent. Corrected 2026-09-20 against the repo manifests.


name: opentelemetry-demo

components:
  - name: K8sCluster
    type: Worker

  - name: frontend-proxy
    type: App
    attributes: { Domain: frontend }
    exposure: external
    deployedOn: K8sCluster
    implementation: frontend-proxy-build
    ports:
      - { name: http_in, protocol: http }
      - { name: frontend_out, protocol: http }
      - { name: flagd_ui_out, protocol: http }
      - { name: telemetry_docs_out, protocol: http }
      - { name: in, protocol: http }

  - name: frontend
    type: App
    attributes: { Domain: frontend }
    exposure: internal
    deployedOn: K8sCluster
    implementation: frontend-build
    ports:
      - { name: proxy_in, protocol: http }
      - { name: ad_out, protocol: grpc }
      - { name: cart_out, protocol: grpc }
      - { name: checkout_out, protocol: grpc }
      - { name: currency_out, protocol: grpc }
      - { name: productcatalog_out, protocol: grpc }
      - { name: quote_out, protocol: http }
      - { name: recommendation_out, protocol: grpc }
      - { name: shipping_out, protocol: grpc }
      - { name: imageprovider_out, protocol: http }
      - { name: otel_collector_out, protocol: http }
      - { name: flagd_out, protocol: grpc }
      - { name: in, protocol: http }

  - name: ad
    type: App
    attributes: { Domain: ads }
    exposure: internal
    deployedOn: K8sCluster
    implementation: ad-build
    ports: [{ name: fe_in, protocol: grpc }, { name: otel_collector_out, protocol: http }, { name: flagd_out, protocol: grpc }]

  - name: cart
    type: App
    attributes: { Domain: cart }
    exposure: internal
    deployedOn: K8sCluster
    implementation: cart-build
    ports:
      - { name: fe_in, protocol: grpc }
      - { name: checkout_in, protocol: grpc }
      - { name: valkey_out, protocol: tcp }
      - { name: otel_collector_out, protocol: http }
      - { name: flagd_out, protocol: grpc }

  - name: valkey-cart
    type: Data
    attributes: { Domain: cart, DataClass: session }
    exposure: internal
    persistent: false
    deployedOn: K8sCluster
    implementation: valkey-cart-build
    ports: [{ name: cart_in, protocol: tcp }]

  - name: checkout
    type: App
    attributes: { Domain: checkout }
    exposure: internal
    deployedOn: K8sCluster
    implementation: checkout-build
    ports:
      - { name: fe_in, protocol: grpc }
      - { name: cart_out, protocol: grpc }
      - { name: currency_out, protocol: grpc }
      - { name: email_out, protocol: http }
      - { name: payment_out, protocol: grpc }
      - { name: productcatalog_out, protocol: grpc }
      - { name: shipping_out, protocol: grpc }
      - { name: otel_collector_out, protocol: http }
      - { name: flagd_out, protocol: grpc }

  - name: currency
    type: App
    attributes: { Domain: currency }
    exposure: internal
    deployedOn: K8sCluster
    implementation: currency-build
    ports:
      - { name: fe_in, protocol: grpc }
      - { name: checkout_in, protocol: grpc }
      - { name: otel_collector_out, protocol: http }

  - name: email
    type: App
    attributes: { Domain: email }
    exposure: internal
    deployedOn: K8sCluster
    implementation: email-build
    ports: [{ name: checkout_in, protocol: http }, { name: otel_collector_out, protocol: http }]

  - name: payment
    type: App
    attributes: { Domain: payment }
    exposure: internal
    deployedOn: K8sCluster
    implementation: payment-build
    ports: [{ name: checkout_in, protocol: grpc }, { name: otel_collector_out, protocol: http }, { name: flagd_out, protocol: grpc }]

  - name: product-catalog
    type: App
    attributes: { Domain: catalog }
    exposure: internal
    deployedOn: K8sCluster
    implementation: product-catalog-build
    ports:
      - { name: fe_in, protocol: grpc }
      - { name: checkout_in, protocol: grpc }
      - { name: recommendation_in, protocol: grpc }
      - { name: db_out, protocol: tcp }
      - { name: otel_collector_out, protocol: http }
      - { name: flagd_out, protocol: grpc }

  - name: astronomy-db
    type: Data
    attributes: { Domain: catalog, DataClass: product }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: astronomy-db-build
    ports: [{ name: catalog_in, protocol: tcp }]

  - name: quote
    type: App
    attributes: { Domain: shipping }
    exposure: internal
    deployedOn: K8sCluster
    implementation: quote-build
    ports: [{ name: fe_in, protocol: http }, { name: otel_collector_out, protocol: http }]

  - name: recommendation
    type: App
    attributes: { Domain: catalog }
    exposure: internal
    deployedOn: K8sCluster
    implementation: recommendation-build
    ports:
      - { name: fe_in, protocol: grpc }
      - { name: productcatalog_out, protocol: grpc }
      - { name: otel_collector_out, protocol: http }
      - { name: flagd_out, protocol: grpc }

  - name: shipping
    type: App
    attributes: { Domain: shipping }
    exposure: internal
    deployedOn: K8sCluster
    implementation: shipping-build
    ports:
      - { name: fe_in, protocol: grpc }
      - { name: checkout_in, protocol: grpc }
      - { name: otel_collector_out, protocol: http }
      - { name: flagd_out, protocol: grpc }

  - name: image-provider
    type: App
    attributes: { Domain: media }
    exposure: internal
    deployedOn: K8sCluster
    implementation: image-provider-build
    ports: [{ name: fe_in, protocol: http }, { name: otel_collector_out, protocol: http }]
  - name: flagd
    type: App
    attributes: { Domain: observability }
    exposure: internal
    deployedOn: K8sCluster
    implementation: flagd-build
    ports: [{ name: in, number: 8013, protocol: grpc }, { name: otel_collector_out, protocol: http }]
  - name: flagd-ui
    type: App
    attributes: { Domain: observability }
    exposure: internal
    deployedOn: K8sCluster
    implementation: flagd-ui-build
    ports: [{ name: in, number: 4000, protocol: http }, { name: otel_collector_out, protocol: http }, { name: flagd_out, protocol: grpc }]
  - name: load-generator
    type: App
    attributes: { Domain: observability }
    exposure: internal
    deployedOn: K8sCluster
    implementation: load-generator-build
    ports: [ { name: otel_collector_out, protocol: http }, { name: flagd_out, protocol: grpc }, { name: frontend_out, protocol: http }, { name: frontend_proxy_out, protocol: http }]
  - name: otel-collector
    type: App
    attributes: { Domain: observability }
    exposure: internal
    deployedOn: K8sCluster
    implementation: otel-collector-build
    ports: [{ name: in, number: 4318, protocol: http }]
  - name: telemetry-docs
    type: App
    attributes: { Domain: observability }
    exposure: internal
    deployedOn: K8sCluster
    implementation: telemetry-docs-build
    ports: [{ name: in, number: 8080, protocol: http }]

