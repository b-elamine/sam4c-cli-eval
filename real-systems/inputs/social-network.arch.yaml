# Modeled from delimitrou/DeathStarBench, socialNetwork/docker-compose.yml (master
# branch, fetched 2026-07-31). Real images, real exposure (nginx-thrift 8080 and
# media-frontend 8081 (container port 8080) are the public entry points. compose also
# publishes host ports for post-storage-service (10002:9090, a debug mapping, modeled
# internal like the other dev-only mappings) and jaeger-agent (16686, tracing UI; jaeger-agent's
# 16686 is a tracing UI, not a business entry point, so jaeger-agent is modeled
# internal). Real per-service backing stores confirmed directly from
# compose (social-graph/post-storage/user-timeline/url-shorten/media/user each
# have their own dedicated mongodb, several also a dedicated redis/memcached).
#
# Same limitation as Hotel Reservation: compose's depends_on is mostly jaeger +
# startup ordering, not the full business call graph. The business edges below
# (nginx-thrift as entry; compose-post-service as the documented fan-out
# orchestrator for post creation, calling text/unique-id/user-mention/media/
# url-shorten/post-storage/user-timeline/social-graph) follow DeathStarBench's own
# documented, standard architecture (Gan et al., ASPLOS'19) -- not independently
# re-verified against a call trace, same honest-provenance approach used
# throughout this study.
#
# Full-manifest pass (2026-09-20): every runnable unit of the ground-truth file is now
# modeled, none excluded. Tooling with host ports (dev UIs) is modeled internal, same
# exposure judgment as before. Edge sources: cache edges verified in DeathStarBench source (user-memcached in
# UserService.cpp, post-storage-memcached in PostStorageService.cpp, url-shorten-memcached
# in UrlShortenService.cpp, home-timeline-redis in HomeTimelineService.cpp, user-timeline-redis
# in UserTimelineService.cpp, social-graph-redis in SocialGraphService.cpp); jaeger-agent
# edges from compose depends_on. media-memcached is deployed by compose but no
# service code reads it (MediaHandler.h has no cache or DB calls), so it has no edge.
#
# persistent = the data volume outlives the pod/container (PVC, volumeClaimTemplate,
# hostPath, or a named compose volume). emptyDir, no volume, or an init-script-only bind
# mount count as not persistent. Corrected 2026-09-20 against the repo manifests.


name: social-network

components:
  - name: K8sCluster
    type: Worker

  - name: nginx-thrift
    type: App
    attributes: { Domain: frontend }
    exposure: external
    deployedOn: K8sCluster
    implementation: nginx-thrift-build
    ports:
      - { name: http_in, number: 8080, protocol: http }
      - { name: post_out, protocol: http }
      - { name: jaeger_agent_out, protocol: udp }
      - { name: home_timeline_service_out, protocol: tcp }
      - { name: social_graph_service_out, protocol: tcp }
      - { name: user_service_out, protocol: tcp }
      - { name: user_timeline_service_out, protocol: tcp }

  - name: media-frontend
    type: App
    attributes: { Domain: frontend }
    exposure: external
    deployedOn: K8sCluster
    implementation: media-frontend-build
    ports:
      - { name: http_in, number: 8080, protocol: http }
      - { name: jaeger_agent_out, protocol: udp }
      - { name: media_mongodb_out, protocol: tcp }

  - name: compose-post-service
    type: App
    attributes: { Domain: post }
    exposure: internal
    deployedOn: K8sCluster
    implementation: compose-post-service-build
    ports:
      - { name: nginx_in, protocol: http }
      - { name: text_out, protocol: tcp }
      - { name: uniqueid_out, protocol: tcp }
      - { name: media_out, protocol: tcp }
      - { name: poststorage_out, protocol: tcp }
      - { name: usertimeline_out, protocol: tcp }
      - { name: user_out, protocol: tcp }
      - { name: hometimeline_out, protocol: tcp }
      - { name: jaeger_agent_out, protocol: udp }

  - name: text-service
    type: App
    attributes: { Domain: post }
    exposure: internal
    deployedOn: K8sCluster
    implementation: text-service-build
    ports: [{ name: post_in, protocol: tcp }, { name: jaeger_agent_out, protocol: udp }, { name: url_shorten_service_out, protocol: tcp }, { name: user_mention_service_out, protocol: tcp }]

  - name: unique-id-service
    type: App
    attributes: { Domain: post }
    exposure: internal
    deployedOn: K8sCluster
    implementation: unique-id-service-build
    ports: [{ name: post_in, protocol: tcp }, { name: jaeger_agent_out, protocol: udp }]

  - name: user-mention-service
    type: App
    attributes: { Domain: post }
    exposure: internal
    deployedOn: K8sCluster
    implementation: user-mention-service-build
    ports: [{ name: jaeger_agent_out, protocol: udp }, { name: in, protocol: tcp }, { name: user_memcached_out, protocol: tcp }, { name: user_mongodb_out, protocol: tcp }]

  - name: media-service
    type: App
    attributes: { Domain: media }
    exposure: internal
    deployedOn: K8sCluster
    implementation: media-service-build
    ports:
      - { name: post_in, protocol: tcp }
      - { name: jaeger_agent_out, protocol: udp }

  - name: media-mongodb
    type: Data
    attributes: { Domain: media, DataClass: media }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: media-mongodb-build
    ports: [{ name: in, protocol: tcp }]

  - name: url-shorten-service
    type: App
    attributes: { Domain: post }
    exposure: internal
    deployedOn: K8sCluster
    implementation: url-shorten-service-build
    ports:
      - { name: db_out, protocol: tcp }
      - { name: url_shorten_memcached_out, protocol: tcp }
      - { name: jaeger_agent_out, protocol: udp }
      - { name: in, protocol: tcp }

  - name: url-shorten-mongodb
    type: Data
    attributes: { Domain: post, DataClass: url }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: url-shorten-mongodb-build
    ports: [{ name: urlshorten_in, number: 27017, protocol: tcp }]

  - name: post-storage-service
    type: App
    attributes: { Domain: post }
    exposure: internal
    deployedOn: K8sCluster
    implementation: post-storage-service-build
    ports:
      - { name: post_in, number: 9090, protocol: tcp }
      - { name: db_out, protocol: tcp }
      - { name: post_storage_memcached_out, protocol: tcp }
      - { name: jaeger_agent_out, protocol: udp }
      - { name: in, protocol: tcp }

  - name: post-storage-mongodb
    type: Data
    attributes: { Domain: post, DataClass: post }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: post-storage-mongodb-build
    ports: [{ name: poststorage_in, number: 27017, protocol: tcp }]

  - name: user-timeline-service
    type: App
    attributes: { Domain: timeline }
    exposure: internal
    deployedOn: K8sCluster
    implementation: user-timeline-service-build
    ports:
      - { name: post_in, protocol: tcp }
      - { name: db_out, protocol: tcp }
      - { name: user_timeline_redis_out, protocol: tcp }
      - { name: jaeger_agent_out, protocol: udp }
      - { name: post_storage_service_out, protocol: tcp }
      - { name: in, protocol: tcp }

  - name: user-timeline-mongodb
    type: Data
    attributes: { Domain: timeline, DataClass: timeline }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: user-timeline-mongodb-build
    ports: [{ name: usertimeline_in, number: 27017, protocol: tcp }]

  - name: social-graph-service
    type: App
    attributes: { Domain: social }
    exposure: internal
    deployedOn: K8sCluster
    implementation: social-graph-service-build
    ports:
      - { name: db_out, protocol: tcp }
      - { name: social_graph_redis_out, protocol: tcp }
      - { name: jaeger_agent_out, protocol: udp }
      - { name: in, protocol: tcp }
      - { name: user_service_out, protocol: tcp }

  - name: social-graph-mongodb
    type: Data
    attributes: { Domain: social, DataClass: social }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: social-graph-mongodb-build
    ports: [{ name: socialgraph_in, number: 27017, protocol: tcp }]

  - name: user-service
    type: App
    attributes: { Domain: account }
    exposure: internal
    deployedOn: K8sCluster
    implementation: user-service-build
    ports:
      - { name: post_in, protocol: tcp }
      - { name: db_out, protocol: tcp }
      - { name: user_memcached_out, protocol: tcp }
      - { name: jaeger_agent_out, protocol: udp }
      - { name: in, protocol: tcp }
      - { name: social_graph_service_out, protocol: tcp }

  - name: user-mongodb
    type: Data
    attributes: { Domain: account, DataClass: account }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: user-mongodb-build
    ports: [{ name: user_in, number: 27017, protocol: tcp }, { name: in, protocol: tcp }]

  - name: home-timeline-service
    type: App
    attributes: { Domain: timeline }
    exposure: internal
    deployedOn: K8sCluster
    implementation: home-timeline-service-build
    ports: [{ name: post_in, protocol: tcp }, { name: home_timeline_redis_out, protocol: tcp }, { name: jaeger_agent_out, protocol: udp }, { name: post_storage_service_out, protocol: tcp }, { name: social_graph_service_out, protocol: tcp }, { name: in, protocol: tcp }]
  - name: home-timeline-redis
    type: Data
    attributes: { Domain: timeline }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: home-timeline-redis-build
    ports: [{ name: in, number: 6379, protocol: tcp }]
  - name: social-graph-redis
    type: Data
    attributes: { Domain: social }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: social-graph-redis-build
    ports: [{ name: in, number: 6379, protocol: tcp }]
  - name: user-timeline-redis
    type: Data
    attributes: { Domain: timeline }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: user-timeline-redis-build
    ports: [{ name: in, number: 6379, protocol: tcp }]
  - name: media-memcached
    type: Data
    attributes: { Domain: media }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: media-memcached-build
    ports: [{ name: in, number: 11211, protocol: tcp }]
  - name: post-storage-memcached
    type: Data
    attributes: { Domain: post }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: post-storage-memcached-build
    ports: [{ name: in, number: 11211, protocol: tcp }]
  - name: url-shorten-memcached
    type: Data
    attributes: { Domain: post }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: url-shorten-memcached-build
    ports: [{ name: in, number: 11211, protocol: tcp }]
  - name: user-memcached
    type: Data
    attributes: { Domain: account }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: user-memcached-build
    ports: [{ name: in, number: 11211, protocol: tcp }]
  - name: jaeger-agent
    type: App
    attributes: { Domain: observability }
    exposure: internal
    deployedOn: K8sCluster
    implementation: jaeger-agent-build
    ports: [{ name: in, number: 6831, protocol: udp }]

