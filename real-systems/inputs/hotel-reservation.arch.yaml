# Modeled from delimitrou/DeathStarBench, hotelReservation/docker-compose.yml
# (master branch, fetched 2026-07-31). Real images, real exposure (frontend is the
# only service with a host port, 5000; consul exposes its own management ports but
# isn't a business entry point). Real per-service backing stores confirmed from
# compose (each of profile/geo/rate/review/attractions/recommendation/user/
# reservation has its own dedicated mongodb, some also a dedicated memcached).
#
# docker-compose's depends_on here is mostly startup ordering + consul service
# discovery, not the full business call graph. The business edges below (frontend
# -> search/profile/recommendation/user/reservation; search -> geo/rate) follow
# DeathStarBench's own documented architecture (Gan et al., ASPLOS'19, and the
# project's README), a well-known, standard benchmark layout -- not independently
# re-verified against a call trace, flagged the same way as TeaStore/Sock Shop's
# role-implied edges.
#
# Full-manifest pass (2026-09-20): every runnable unit of the ground-truth file is now
# modeled, none excluded. Tooling with host ports (dev UIs) is modeled internal, same
# exposure judgment as before. Edge sources: frontend -> attractions and frontend -> review verified in
# services/frontend/server.go (7 gRPC clients); every service -> jaeger from config.json
# (jaegerAddress jaeger:6831, udp); cache and DB edges from compose depends_on and
# config.json (memcached-profile/rate/reserve/review, mongodb-attractions/review).


name: hotel-reservation

components:
  - name: K8sCluster
    type: Worker

  - name: consul
    type: App
    attributes: { Domain: platform }
    exposure: internal
    deployedOn: K8sCluster
    implementation: consul-build
    ports: [{ name: registry_in, protocol: tcp }, { name: in, protocol: http }]

  - name: frontend
    type: App
    attributes: { Domain: frontend }
    exposure: external
    deployedOn: K8sCluster
    implementation: frontend-build
    ports:
      - { name: http_in, number: 5000, protocol: http }
      - { name: search_out, protocol: grpc }
      - { name: profile_out, protocol: grpc }
      - { name: recommendation_out, protocol: grpc }
      - { name: user_out, protocol: grpc }
      - { name: reservation_out, protocol: grpc }
      - { name: attractions_out, protocol: grpc }
      - { name: review_out, protocol: grpc }
      - { name: jaeger_out, protocol: udp }
      - { name: consul_out, protocol: http }

  - name: search
    type: App
    attributes: { Domain: search }
    exposure: internal
    deployedOn: K8sCluster
    implementation: search-build
    ports:
      - { name: fe_in, protocol: grpc }
      - { name: geo_out, protocol: grpc }
      - { name: rate_out, protocol: grpc }
      - { name: jaeger_out, protocol: udp }
      - { name: consul_out, protocol: http }

  - name: geo
    type: App
    attributes: { Domain: search }
    exposure: internal
    deployedOn: K8sCluster
    implementation: geo-build
    ports:
      - { name: search_in, protocol: grpc }
      - { name: db_out, protocol: tcp }
      - { name: jaeger_out, protocol: udp }
      - { name: consul_out, protocol: http }

  - name: mongodb-geo
    type: Data
    attributes: { Domain: search, DataClass: geo }
    exposure: internal
    persistent: true
    storage: unspecified
    deployedOn: K8sCluster
    implementation: mongodb-geo-build
    ports: [{ name: geo_in, number: 27017, protocol: tcp }]

  - name: rate
    type: App
    attributes: { Domain: search }
    exposure: internal
    deployedOn: K8sCluster
    implementation: rate-build
    ports:
      - { name: search_in, protocol: grpc }
      - { name: db_out, protocol: tcp }
      - { name: memcached_rate_out, protocol: tcp }
      - { name: jaeger_out, protocol: udp }
      - { name: consul_out, protocol: http }

  - name: mongodb-rate
    type: Data
    attributes: { Domain: search, DataClass: rate }
    exposure: internal
    persistent: true
    storage: unspecified
    deployedOn: K8sCluster
    implementation: mongodb-rate-build
    ports: [{ name: rate_in, number: 27017, protocol: tcp }]

  - name: profile
    type: App
    attributes: { Domain: profile }
    exposure: internal
    deployedOn: K8sCluster
    implementation: profile-build
    ports:
      - { name: fe_in, protocol: grpc }
      - { name: db_out, protocol: tcp }
      - { name: memcached_profile_out, protocol: tcp }
      - { name: jaeger_out, protocol: udp }
      - { name: consul_out, protocol: http }

  - name: mongodb-profile
    type: Data
    attributes: { Domain: profile, DataClass: profile }
    exposure: internal
    persistent: true
    storage: unspecified
    deployedOn: K8sCluster
    implementation: mongodb-profile-build
    ports: [{ name: profile_in, number: 27017, protocol: tcp }]

  - name: recommendation
    type: App
    attributes: { Domain: recommendation }
    exposure: internal
    deployedOn: K8sCluster
    implementation: recommendation-build
    ports:
      - { name: fe_in, protocol: grpc }
      - { name: db_out, protocol: tcp }
      - { name: jaeger_out, protocol: udp }
      - { name: consul_out, protocol: http }

  - name: mongodb-recommendation
    type: Data
    attributes: { Domain: recommendation, DataClass: recommendation }
    exposure: internal
    persistent: true
    storage: unspecified
    deployedOn: K8sCluster
    implementation: mongodb-recommendation-build
    ports: [{ name: recommendation_in, number: 27017, protocol: tcp }]

  - name: user
    type: App
    attributes: { Domain: account }
    exposure: internal
    deployedOn: K8sCluster
    implementation: user-build
    ports:
      - { name: fe_in, protocol: grpc }
      - { name: db_out, protocol: tcp }
      - { name: jaeger_out, protocol: udp }
      - { name: consul_out, protocol: http }

  - name: mongodb-user
    type: Data
    attributes: { Domain: account, DataClass: account }
    exposure: internal
    persistent: true
    storage: unspecified
    deployedOn: K8sCluster
    implementation: mongodb-user-build
    ports: [{ name: user_in, number: 27017, protocol: tcp }]

  - name: reservation
    type: App
    attributes: { Domain: reservation }
    exposure: internal
    deployedOn: K8sCluster
    implementation: reservation-build
    ports:
      - { name: fe_in, protocol: grpc }
      - { name: db_out, protocol: tcp }
      - { name: memcached_reserve_out, protocol: tcp }
      - { name: jaeger_out, protocol: udp }
      - { name: consul_out, protocol: http }

  - name: mongodb-reservation
    type: Data
    attributes: { Domain: reservation, DataClass: reservation }
    exposure: internal
    persistent: true
    storage: unspecified
    deployedOn: K8sCluster
    implementation: mongodb-reservation-build
    ports: [{ name: reservation_in, number: 27017, protocol: tcp }]
  - name: attractions
    type: App
    attributes: { Domain: attractions }
    exposure: internal
    deployedOn: K8sCluster
    implementation: attractions-build
    ports: [{ name: in, number: 8089, protocol: grpc }, { name: mongodb_attractions_out, protocol: tcp }, { name: jaeger_out, protocol: udp }, { name: consul_out, protocol: http }]
  - name: review
    type: App
    attributes: { Domain: review }
    exposure: internal
    deployedOn: K8sCluster
    implementation: review-build
    ports: [{ name: in, number: 8081, protocol: grpc }, { name: mongodb_review_out, protocol: tcp }, { name: memcached_review_out, protocol: tcp }, { name: jaeger_out, protocol: udp }, { name: consul_out, protocol: http }]
  - name: mongodb-attractions
    type: Data
    attributes: { Domain: attractions }
    exposure: internal
    persistent: true
    storage: unspecified
    deployedOn: K8sCluster
    implementation: mongodb-attractions-build
    ports: [{ name: in, number: 27017, protocol: tcp }]
  - name: mongodb-review
    type: Data
    attributes: { Domain: review }
    exposure: internal
    persistent: true
    storage: unspecified
    deployedOn: K8sCluster
    implementation: mongodb-review-build
    ports: [{ name: in, number: 27017, protocol: tcp }]
  - name: memcached-profile
    type: Data
    attributes: { Domain: profile }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: memcached-profile-build
    ports: [{ name: in, number: 11211, protocol: tcp }]
  - name: memcached-rate
    type: Data
    attributes: { Domain: search }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: memcached-rate-build
    ports: [{ name: in, number: 11211, protocol: tcp }]
  - name: memcached-reserve
    type: Data
    attributes: { Domain: reservation }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: memcached-reserve-build
    ports: [{ name: in, number: 11211, protocol: tcp }]
  - name: memcached-review
    type: Data
    attributes: { Domain: review }
    exposure: internal
    persistent: false
    storage: unspecified
    deployedOn: K8sCluster
    implementation: memcached-review-build
    ports: [{ name: in, number: 11211, protocol: tcp }]
  - name: jaeger
    type: App
    attributes: { Domain: observability }
    exposure: internal
    deployedOn: K8sCluster
    implementation: jaeger-build
    ports: [{ name: in, number: 6831, protocol: udp }]

